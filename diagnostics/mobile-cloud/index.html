<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000"><title>星雲の描画診断</title><style>html,body{margin:0;background:#000;color:#eee;font:13px/1.6 -apple-system,sans-serif}#cosmos{position:fixed;inset:0;width:100%;height:100%;opacity:1}aside{position:fixed;z-index:2;left:10px;right:10px;top:10px;max-width:430px;padding:12px;background:#080b16e8;border:1px solid #6d799455;border-radius:9px}h1{font-size:14px;margin:0 0 6px}p{margin:5px 0;color:#c0c8d4;font-size:11px}label{display:block;margin:7px 0}select,button{font:inherit;color:#fff;background:#151d30;border:1px solid #6d7994;border-radius:4px;padding:5px}select{max-width:100%}button{margin-right:8px}#info{font-size:10px;max-height:70px;overflow:auto;white-space:pre-wrap}a{color:#c4d9ff}</style><canvas id="cosmos" aria-hidden="true"></canvas><aside><h1>星雲の描画診断（本体とは別の表示）</h1><p>この画面は静止時点の比較です。<a href="full/?case=B-original-trial">本体と同じ構成・アニメーションで比較する</a>（同じパスワード）</p><label>比較 <select id="variant"><option value="A-saved">① 保存済みの正常版</option><option value="B-original-trial">② 不具合時の追加演出</option><option value="C-cloud-only">③ 星雲の局所発光だけ追加</option><option value="D-stars-only">④ 光る星だけ追加</option><option value="E-normalized">⑤ ②の数値を正規化</option><option value="F-normalized-unrolled">⑥ ⑤のループを固定展開</option></select></label><label>配置 <select id="seed"><option>13</option><option>37</option><option>71</option></select>　時点 <select id="time"><option value="0">0秒</option><option value="60">60秒</option><option value="300">300秒</option></select></label><button id="hide">操作欄を隠す</button><button id="copy">端末情報をコピー</button><p>情報は自動送信しません。操作欄は画面タップで再表示できます。</p><div id="info"></div></aside><script>
const names=['A-saved','B-original-trial','C-cloud-only','D-stars-only','E-normalized','F-normalized-unrolled'];
const q=new URLSearchParams(location.search),variant=names.includes(q.get('case'))?q.get('case'):'A-saved',seed=Number(q.get('seed'))||13,time=Number(q.get('time'))||0;
let state=seed;Math.random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296};
for(const [id,value] of [['variant',variant],['seed',String(seed)],['time',String(time)]]){const el=document.getElementById(id);el.value=value;el.onchange=()=>{const next=new URLSearchParams({case:document.getElementById('variant').value,seed:document.getElementById('seed').value,time:document.getElementById('time').value});location.search=next.toString()}}
const script=document.createElement('script');script.src=variant+'.js';script.onload=()=>{try{const scene=window.createGalaxy(document.getElementById('cosmos'),true);document.getElementById('info').textContent=`${variant} / seed ${seed} / ${time}s / ${scene.renderer}\n${innerWidth}x${innerHeight} DPR ${devicePixelRatio}\n${navigator.userAgent}`}catch(e){document.getElementById('info').textContent=String(e)}};document.body.append(script);
document.getElementById('hide').onclick=e=>{e.stopPropagation();document.querySelector('aside').hidden=true};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('info').textContent);document.getElementById('copy').textContent='コピーしました'}catch{document.getElementById('copy').textContent='下の端末情報をご参照ください'}};document.getElementById('cosmos').onclick=()=>document.querySelector('aside').hidden=false;
</script></html>
